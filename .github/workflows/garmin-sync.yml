name: garmin-sync

on:
  schedule:
    - cron: "5 4 * * *"
    - cron: "5 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: traka-sync/sync/requirements.txt

      - run: pip install -r traka-sync/sync/requirements.txt

      - name: Sync Garmin data
        env:
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
          GARMIN_TOKEN_OUT_DIR: ${{ runner.temp }}/garmin-tokens
          SYNC_DAYS: "28"
        run: python traka-sync/sync/sync_garmin.py

      - name: Commit data
        run: |
          git config user.name "garmin-sync"
          git config user.email "garmin-sync@users.noreply.github.com"
          git add data/latest.json data/latest.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "sync: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Roll forward rotated Garmin token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not set — skipping token renew (sync still worked)."; exit 0
          fi
          f="${RUNNER_TEMP}/garmin-tokens/GARMIN_TOKEN_B64"
          [ -f "$f" ] || { echo "Token unchanged, nothing to renew."; exit 0; }
          gh secret set GARMIN_TOKEN_B64 < "$f"
          echo "Renewed GARMIN_TOKEN_B64"
